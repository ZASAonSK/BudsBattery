name: Build and release
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:
permissions:
  contents: write   # create the tag and the release
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    # Xcode 26 on macos-26 provides the Liquid Glass SDK.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags are needed to number revisions
      - name: Work out the version
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)
          git fetch --tags --force -q
          # A new MARKETING_VERSION gives release v<version>. Pushing code without bumping it
          # gives revisions v<version>.1, .2, ... so AltStore still sees a newer version.
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            N=$(git tag -l "v$VERSION.*" | wc -l | tr -d ' ')
            LABEL="$VERSION.$((N + 1))"
          else
            LABEL="$VERSION"
          fi
          {
            echo "VERSION=$VERSION"
            echo "LABEL=$LABEL"
            echo "TAG=v$LABEL"
            echo "BUILD=${{ github.run_number }}"
          } >> "$GITHUB_ENV"
          echo "Building $LABEL"
      - name: Test decoder
        run: |
          set -euo pipefail
          swiftc Sources/BudsDecoder.swift Sources/History.swift Tests/main.swift -o /tmp/buds-tests
          /tmp/buds-tests
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project BudsBattery.xcodeproj -scheme BudsBattery -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO MARKETING_VERSION="$LABEL" CURRENT_PROJECT_VERSION="$BUILD" build 2>&1 | tee build.log
          rm -rf Payload
          mkdir -p Payload artifact
          cp -R build/Build/Products/Release-iphoneos/BudsBattery.app Payload/
          zip -qry artifact/BudsBattery.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BudsBattery-${{ env.LABEL }}-ipa
          path: artifact/BudsBattery.ipa
          if-no-files-found: error
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Release notes: the CHANGELOG section for a new version, otherwise generated from commits.
          NOTES_ARGS=(--generate-notes)
          if [ "$LABEL" = "$VERSION" ]; then
            awk -v v="$VERSION" '/^## /{p = index($0, "## " v) == 1; next} p' CHANGELOG.md > notes.md
            if [ -n "$(tr -d '[:space:]' < notes.md)" ]; then NOTES_ARGS=(--notes-file notes.md); fi
          fi
          gh release create "$TAG" artifact/BudsBattery.ipa --target "$GITHUB_SHA" --title "Buds Battery $LABEL" "${NOTES_ARGS[@]}"
      - name: Update the AltStore source
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The source (AltStore / SideStore / Feather) lives on its own `altstore` branch so that
          # main has no bot commits and the releases only contain the IPA. The previous file is
          # carried forward to keep the version history.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf source
          if git ls-remote --exit-code --heads "$REMOTE" altstore > /dev/null 2>&1; then
            git clone --quiet --depth 1 --branch altstore "$REMOTE" source
          else
            git init -q source
            git -C source checkout -q --orphan altstore
            git -C source remote add origin "$REMOTE"
          fi
          python3 - <<'PY'
          import json, os
          repo, tag, label = os.environ["GITHUB_REPOSITORY"], os.environ["TAG"], os.environ["LABEL"]
          base = f"https://github.com/{repo}"
          icon = f"https://raw.githubusercontent.com/{repo}/main/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          ipa = "artifact/BudsBattery.ipa"
          size = os.path.getsize(ipa)
          date = os.popen("date -u +%Y-%m-%d").read().strip()
          url = f"{base}/releases/download/{tag}/BudsBattery.ipa"
          blurb = "Battery levels of Samsung Galaxy Buds on iPhone: left earbud, right earbud and charging case."
          permission = "The app reads the battery level of your Galaxy Buds from their Bluetooth broadcast and connection."
          entry = {
              "version": label,
              "buildVersion": os.environ["BUILD"],
              "date": date,
              "localizedDescription": f"Version {label}. See the release notes on GitHub.",
              "downloadURL": url,
              "size": size,
              "minOSVersion": "16.0",
          }
          versions = []
          try:
              versions = json.load(open("source/altstore.json"))["apps"][0].get("versions", [])
          except (OSError, ValueError, KeyError, IndexError):
              pass
          versions = [entry] + [v for v in versions if v.get("version") != label][:19]
          source = {
              "name": "Buds Battery",
              "identifier": "com.budsbattery.source",
              "sourceURL": f"https://raw.githubusercontent.com/{repo}/altstore/altstore.json",
              "subtitle": "Galaxy Buds battery on iPhone",
              "description": blurb,
              "iconURL": icon,
              "website": base,
              "tintColor": "36C5B0",
              "apps": [{
                  "name": "Buds Battery",
                  "bundleIdentifier": "com.budsbattery.app",
                  "developerName": repo.split("/")[0],
                  "subtitle": "Galaxy Buds battery on iPhone",
                  "localizedDescription": blurb + "\n\nUnofficial, open source, no network access. Battery only: no ANC control, in-ear detection or charging state.",
                  "iconURL": icon,
                  "tintColor": "36C5B0",
                  "category": "utilities",
                  "screenshotURLs": [],
                  "versions": versions,
                  # fields read by older AltStore versions
                  "version": label,
                  "versionDate": date,
                  "versionDescription": f"Version {label}",
                  "downloadURL": url,
                  "size": size,
                  "appPermissions": {"entitlements": [], "privacy": {"NSBluetoothAlwaysUsageDescription": permission}},
              }],
              "news": [],
          }
          json.dump(source, open("source/altstore.json", "w"), indent=2, ensure_ascii=False)
          PY
          python3 -m json.tool source/altstore.json > /dev/null
          printf '%s\n' "Generated by CI. This branch only holds altstore.json, the AltStore / SideStore / Feather source. Do not edit." > source/README.md
          cd source
          git add altstore.json README.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Add $LABEL"
          git push -q origin HEAD:altstore
      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
